<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>html,body{height:100%;margin:0}body{overflow:hidden}.workspace{height:100%;display:flex;flex-direction:column}.workspace-main{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}.left-drawer,.right-drawer{background:#fff;width:320px;flex:0 0 320px}.canvas-area{flex:1 1 0%;min-width:0;min-height:0;overflow:hidden;background:#eef}.canvas-viewport{width:100%;height:100%;overflow:auto}.drawer-rail{position:absolute;top:50%;width:34px;height:92px}.left-rail{inset-inline-start:0}.right-rail{inset-inline-end:0}.workspace-main.left-collapsed .left-drawer{width:0;flex-basis:0;max-width:0;overflow:hidden}.workspace-main.right-collapsed .right-drawer{width:0;flex-basis:0;max-width:0;overflow:hidden}@media(max-width:900px){.workspace-main{height:100%}.left-drawer,.right-drawer{position:absolute;top:0;bottom:0}.canvas-area{width:100%;flex:1}.workspace-main.left-collapsed .left-drawer{transform:translateX(-105%)}.workspace-main.right-collapsed .right-drawer{transform:translateX(105%)}}</style></head><body><div class="workspace"><div class="workspace-main" id="w"><aside class="left-drawer"></aside><main class="canvas-area" id="c"><div id="v" class="canvas-viewport"><div style="height:1400px;width:100px"></div></div></main><aside class="right-drawer"></aside><button class="drawer-rail left-rail"></button><button class="drawer-rail right-rail"></button></div></div><script>const w=document.getElementById('w'),c=document.getElementById('c'),v=document.getElementById('v');const out=[];function snap(label){out.push({label,root:w.getBoundingClientRect().width,canvas:c.getBoundingClientRect().width,viewport:v.getBoundingClientRect().width,scroll:v.scrollHeight>v.clientHeight});}snap('open');w.classList.add('left-collapsed');snap('left-closed');w.classList.add('right-collapsed');snap('both-closed');w.classList.remove('left-collapsed');w.classList.remove('right-collapsed');snap('reopened');document.body.insertAdjacentHTML('beforeend','<pre id="result">'+JSON.stringify(out)+'</pre>');</script></body></html>
